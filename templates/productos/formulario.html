{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<p class="subtitulo"><a href="{{ url_for('productos.lista') }}">Volver al catálogo</a></p>

<form class="formulario" method="post">
  <label>Nombre
    <input name="nombre" maxlength="100" required value="{{ datos.nombre }}">
  </label>
  <label>Categoría
    <select name="id_categoria" required>
      <option value="">Seleccione…</option>
      {% for c in categorias %}
      <option value="{{ c.id_categoria }}" {{ 'selected' if c.id_categoria|string == datos.id_categoria|string }}>{{ c.nombre }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="campos-en-linea">
    <label>Precio
      <input name="precio" type="number" min="1" step="0.01" required value="{{ datos.precio }}">
    </label>
    <label>Stock
      <input name="stock" type="number" min="0" step="1" required value="{{ datos.stock }}">
    </label>
  </div>
  <label class="check">
    <input type="checkbox" name="activo" {% if datos.activo %}checked{% endif %}>
    Activo
  </label>
  <button class="boton" type="submit">Guardar</button>
</form>
{% endblock %}
